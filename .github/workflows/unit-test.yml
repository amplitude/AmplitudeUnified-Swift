name: Unit Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

jobs:
  unit-test:
    name: Unit ${{ matrix.platform }} - Xcode ${{ matrix.xcode }} - OS ${{ matrix.test-destination-os }}
    runs-on: ${{ matrix.runs-on }}

    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # Oldest/newest preinstalled runtimes on the selected runner images.
        include:
          - runs-on: macos-15
            platform: iOS
            xcode: "26.0"
            test-destination-os: "18.5"
            device: "iPhone 16"

          - runs-on: macos-26
            platform: iOS
            xcode: "26.0"
            test-destination-os: "26.5"
            device: "iPhone 17"

          - runs-on: macos-15
            platform: macOS
            xcode: "26.0"
            test-destination-os: "15"

          - runs-on: macos-26
            platform: macOS
            xcode: "26.0"
            test-destination-os: "26"

          - runs-on: macos-15
            platform: tvOS
            xcode: "26.0"
            test-destination-os: "18.5"
            device: "Apple TV"

          - runs-on: macos-26
            platform: tvOS
            xcode: "26.0"
            test-destination-os: "26.5"
            device: "Apple TV"

          - runs-on: macos-15
            platform: watchOS
            xcode: "26.0"
            test-destination-os: "11.5"
            device: "Apple Watch Series 10 (42mm)"

          - runs-on: macos-26
            platform: watchOS
            xcode: "26.0"
            test-destination-os: "26.5"
            device: "Apple Watch Series 11 (42mm)"

          - runs-on: macos-15
            platform: visionOS
            xcode: "26.0"
            test-destination-os: "2.3"
            device: "Apple Vision Pro"

          - runs-on: macos-26
            platform: visionOS
            xcode: "26.0"
            test-destination-os: "26.5"
            device: "Apple Vision Pro"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set Xcode ${{ matrix.xcode }}
        run: |
          sudo xcode-select -switch /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Install Apple platform SDKs
        run: |
          # Warm up CoreSimulator to avoid "Unable to connect to simulator":
          # https://github.com/actions/runner-images/issues/12862#issuecomment-3239326872
          xcrun simctl list > /dev/null
          case "${{ matrix.platform }}" in
            iOS)
              sudo xcodebuild -downloadPlatform iOS
              ;;
            tvOS)
              sudo xcodebuild -downloadPlatform tvOS
              ;;
            watchOS)
              sudo xcodebuild -downloadPlatform watchOS
              ;;
            visionOS)
              sudo xcodebuild -downloadPlatform visionOS
              ;;
          esac
      - name: List Simulators
        run: |
          xcrun simctl list
      - name: List Project Configuration
        run: |
          xcodebuild -list
      - name: ${{ matrix.platform }} Tests
        run: |
          case "${{ matrix.platform }}" in
            iOS)
              xcodebuild test \
                -scheme AmplitudeUnified \
                -sdk iphonesimulator \
                -destination 'platform=iOS Simulator,OS=${{ matrix.test-destination-os }},name=${{ matrix.device }}'
              ;;
            macOS)
              xcodebuild test \
                -scheme AmplitudeUnified \
                -sdk macosx \
                -destination 'platform=macOS'
              ;;
            tvOS)
              xcodebuild \
                -scheme AmplitudeUnified \
                -sdk appletvsimulator \
                -destination 'platform=tvOS Simulator,OS=${{ matrix.test-destination-os }},name=${{ matrix.device }}' \
                test
              ;;
            watchOS)
              xcodebuild \
                -scheme AmplitudeUnified \
                -sdk watchsimulator \
                -destination 'platform=watchOS Simulator,OS=${{ matrix.test-destination-os }},name=${{ matrix.device }}' \
                test
              ;;
            visionOS)
              xcodebuild \
                -scheme AmplitudeUnified \
                -sdk xrsimulator \
                -destination 'platform=visionOS Simulator,OS=${{ matrix.test-destination-os }},name=${{ matrix.device }}' \
                test
              ;;
          esac
